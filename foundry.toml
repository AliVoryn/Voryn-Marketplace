[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer_runs = 200
via_ir = false
fuzz = { runs = 512, max_test_rejects = 65536 }
invariant = { runs = 128, depth = 128, fail_on_revert = false }
ffi = false
gas_reports = ["*"]
bytecode_hash = "ipfs"
 

[profile.ci]
fuzz = { runs = 4096, max_test_rejects = 262144 }
invariant = { runs = 512, depth = 256, fail_on_revert = false }
verbosity = 3

[profile.ci-fast]
fuzz = { runs = 256, max_test_rejects = 32768 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }
verbosity = 2

[fmt]
line_length = 120
bracket_spacing = true
int_types = "long"
quote_style = "double"
multiline_func_header = "attributes_first"

[lint]
lint_on_build = false
ignore = ["test/**", "script/**", "src/automation/chainlink/**"]
exclude_lints = ["block-timestamp"]
